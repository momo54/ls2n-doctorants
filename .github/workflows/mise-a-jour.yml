name: Mise à jour quotidienne

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h17 (heure d'hiver) / 7h17 (heure d'été) à Paris
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: pip install playwright
        # Google Chrome est préinstallé sur les runners ubuntu-latest (channel="chrome").

      - name: Générer la page
        env:
          TZ: Europe/Paris
        run: python nouveaux_doctorants_ls2n.py --quiet --html site/index.html --csv site/ls2n.csv

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
